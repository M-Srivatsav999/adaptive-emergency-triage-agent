name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: triage, POSTGRES_PASSWORD: ci-only-password, POSTGRES_DB: triage_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U triage" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pip install -r requirements-dev.txt
      - name: Unit, API, security and PostgreSQL tests
        env:
          TEST_DATABASE_URL: postgresql://triage:ci-only-password@localhost:5432/triage_test
        run: python -m pytest -q
      - name: Release gate (0 unsafe under-triage, accuracy thresholds)
        run: python -m eval.ci_gate
